name: Offline release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check harness scripts finetuning reproduction --select F821,E9
      - run: python scripts/check_public_release.py
      - run: python scripts/make_paper_tables.py --check --no-write
